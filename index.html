<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gunpowder Studios Box Packer v9.0</title>
<style>
:root{--p:#242424;--t:#f4f1e8;--m:#bdb7aa;--g:#d0a53b;--ok:#53c26b;--bad:#ef6461;--b:#464646}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#151515;color:var(--t);line-height:1.45}
header{padding:24px 18px;text-align:center;border-bottom:4px solid var(--g);background:#101010}
h1{margin:0}
.muted,small{color:var(--m)}
.wrap{max-width:1350px;margin:auto;padding:20px;display:grid;grid-template-columns:1.3fr .85fr;gap:20px}
.panel,.card{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:16px}
.card{background:#181818}
h2,h3{color:var(--g);margin-top:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{padding:12px;text-align:center;background:#2b2b2b;border:1px solid var(--b);border-radius:10px;cursor:pointer}
.tab.active{color:var(--g);border-color:var(--g)}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 7px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}
th{color:var(--g)}
input,select{background:#111;color:var(--t);border:1px solid #555;border-radius:7px;padding:8px;width:100%}
input:disabled{opacity:.4;cursor:not-allowed}
.qty{width:88px}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.control{background:#303030;padding:10px;border-radius:10px}
label{display:block;color:var(--m);font-size:13px;font-weight:bold;margin-bottom:5px}
.big{font-size:36px;font-weight:900}
.ok{color:var(--ok)}
.bad{color:var(--bad)}
.line{padding:8px 0;border-bottom:1px solid #333}
.warning{background:#392b12;border:1px solid var(--g);border-radius:10px;padding:12px;margin:10px 0}
.warning strong{color:#ffd76a}
.mode-note{margin:10px 0 4px;color:#ffd76a;font-weight:bold}
button{background:var(--g);border:0;border-radius:8px;padding:10px 13px;font-weight:bold;cursor:pointer;margin:6px 5px 0 0}
.copy-status{color:var(--ok);font-size:13px;margin-left:8px}
.unit-spec{margin-top:6px;padding:7px 9px;background:#202020;border-left:3px solid var(--g);border-radius:5px;line-height:1.45}
.unit-spec strong{color:#f4f1e8}
.unit-spec .secondary{color:var(--m)}
.carton-spec{line-height:1.5}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.controls,.tabs{grid-template-columns:1fr}.hide-mobile{display:none}}
</style>
</head>
<body>
<header>
<h1>Gunpowder Studios Box Packer v9.0</h1>
<p>Game boxes · master cartons · pallet packing · metric and US measurements</p>
</header>

<main class="wrap">
<div>
<section class="panel">
<h2>Mode</h2>
<div class="tabs">
<div id="t-parcel" class="tab active" onclick="setMode('parcel')">Parcel Mode</div>
<div id="t-carton" class="tab" onclick="setMode('carton')">Carton Mode</div>
<div id="t-pallet" class="tab" onclick="setMode('pallet')">Pallet Mode</div>
</div>
<div id="modeNote" class="mode-note"></div>
</section>

<section class="panel">
<h2>Products</h2>
<table>
<thead>
<tr>
<th>Product / individual box</th>
<th class="hide-mobile">Master carton</th>
<th id="qtyHead">Games</th>
</tr>
</thead>
<tbody id="products"></tbody>
</table>
<button onclick="resetQ()">Reset quantities</button>
</section>

<section class="panel" id="palletControls" style="display:none">
<h2>Pallet settings</h2>
<div class="controls">
<div class="control">
<label>Pallet type</label>
<select id="palletType" onchange="draw()">
<option value="uk">UK 120 × 100 cm</option>
<option value="euro">Euro 120 × 80 cm</option>
</select>
</div>
<div class="control">
<label>Max loaded height cm</label>
<input id="height" type="number" value="180" oninput="draw()">
</div>
<div class="control">
<label>Pallet weight kg</label>
<input id="baseWeight" type="number" value="20" step=".1" oninput="draw()">
</div>
<div class="control">
<label>Pallets to use</label>
<input id="palletOverride" type="number" min="0" step="1" value="0" oninput="draw()">
<small>0 = automatic</small>
</div>
<div class="control">
<label>Packing allowance</label>
<select id="factor" onchange="draw()">
<option value="1">Tight</option>
<option value="1.15" selected>Normal 15%</option>
<option value="1.3">Loose 30%</option>
</select>
</div>
</div>
</section>
</div>

<aside class="panel">
<h2>Result</h2>
<div class="card">
<div class="muted" id="metricLabel">Product weight</div>
<div class="big ok" id="metric">0</div>
<div id="imperialMetric"></div>
</div>

<div class="card">
<h3>Breakdown</h3>
<div id="breakdown"></div>
</div>

<div class="card">
<h3 id="logTitle">Parcel detail</h3>
<div id="logistics"></div>
<div id="copyShipperWrap" style="display:none">
<button onclick="copyForShipper()">Copy packing details</button>
<span id="copyStatus" class="copy-status"></span>
</div>
</div>
</aside>
</main>

<script>
let mode='parcel',shipperText='';

const P=[
['Bag of Dungeon','BOD',956,12,10.4,43.7,34.6,23.7,'Includes shipping box and packing materials',21,21,5],
['Bag of Dungeon 2','BOD2',779,12,10.4,43.7,34.6,23.7,'',21,21,5],
['Book of Dungeon','Book',335,0,0,0,0,0,'No master-carton sheet supplied',15,23,1.5],
['Legends 1','L1',165,40,7.5,35.5,29.5,25.5,'',12,17,3],
['Legends 2','L2',341,20,7.0,29,33.6,21.4,'',13,19,3],
['7 Moons Base','7M Base',963,8,7.7,45,23,24,'Parcel weight estimated from carton gross ÷ 8',21,21,5],
['7 Moons Deluxe','7M Deluxe',1111,8,9.3,45,23,24,'',21,21,5],
['Rabbito','Rabbito',652,8,6.1,44,30.5,22.8,'',21,21,7],
['Who Stole My Cheese?','Cheese',167,12,2.3,25,25,16.5,'',11,11,6],
['Kastles','Kastles',153,90,14.3,44.5,24.8,23,'',10,8,3]
].map(x=>({
 name:x[0],short:x[1],weight:x[2],
 cq:x[3],cw:x[4],cl:x[5],cwi:x[6],ch:x[7],
 note:x[8],ul:x[9],uw:x[10],uh:x[11]
}));

const qtyState={parcel:P.map(()=>0),carton:P.map(()=>0),pallet:P.map(()=>0)};
const inch=x=>(x/2.54).toFixed(2);
const lb=x=>(x*2.2046226218).toFixed(2);
const oz=x=>(x*35.27396195).toFixed(1);

function setMode(m){mode=m;make();draw()}

function saveQty(i){
 qtyState[mode][i]=Math.max(0,Number(document.getElementById('q'+i)?.value||0)||0);
 draw();
}

function make(){
 const cartonMode=mode!=='parcel';

 document.getElementById('products').innerHTML=P.map((p,i)=>{
   const noCarton=cartonMode&&!p.cq;
   const kg=(p.weight/1000).toFixed(3);
   const pounds=lb(p.weight/1000);
   const ounces=oz(p.weight/1000);

   const unitSpec=
     '<div class="unit-spec">'+
     '<strong>Individual box</strong><br>'+
     p.ul+' × '+p.uw+' × '+p.uh+' cm · '+p.weight+' g / '+kg+' kg<br>'+
     '<span class="secondary">'+inch(p.ul)+' × '+inch(p.uw)+' × '+inch(p.uh)+' in · '+pounds+' lb · '+ounces+' oz</span>'+
     (p.note?'<br><small>'+p.note+'</small>':'')+
     '</div>';

   const cartonText=p.cq
     ? '<div class="carton-spec"><strong>'+p.cq+'/ctn</strong><br>'+
       p.cl+' × '+p.cwi+' × '+p.ch+' cm<br>'+
       inch(p.cl)+' × '+inch(p.cwi)+' × '+inch(p.ch)+' in<br>'+
       p.cw+' kg / '+lb(p.cw)+' lb gross</div>'
     : '<span class="muted">No carton data</span>';

   return '<tr>'+
     '<td><strong>'+p.name+'</strong>'+unitSpec+'</td>'+
     '<td class="hide-mobile">'+cartonText+'</td>'+
     '<td><input class="qty" id="q'+i+'" type="number" min="0" step="1" value="'+qtyState[mode][i]+'" '+(noCarton?'disabled':'')+' oninput="saveQty('+i+')">'+(noCarton?'<br><small>n/a</small>':'')+'</td>'+
     '</tr>';
 }).join('');

 updateModeUI();
}

function updateModeUI(){
 ['parcel','carton','pallet'].forEach(x=>document.getElementById('t-'+x).classList.toggle('active',x===mode));
 document.getElementById('palletControls').style.display=mode==='pallet'?'block':'none';
 document.getElementById('copyShipperWrap').style.display=mode==='pallet'?'block':'none';
 document.getElementById('qtyHead').textContent=mode==='parcel'?'Games':'Cartons';

 document.getElementById('modeNote').textContent=
   mode==='parcel'
   ? 'Parcel Mode: enter individual games. Weight is calculated game by game.'
   : mode==='carton'
   ? 'Carton Mode: enter full master cartons. Total games, gross weight and volume are calculated from carton specs.'
   : 'Pallet Mode: enter master cartons. The app estimates pallet count, height and shipment weight.';

 document.getElementById('logTitle').textContent=
   mode==='parcel'?'Parcel detail':
   mode==='carton'?'Carton detail':'Carton / pallet estimate';
}

function sel(){
 return P.map((p,i)=>{
   const inputQty=Math.max(0,Number(qtyState[mode][i])||0);
   if(!inputQty)return null;
   const units=mode==='parcel'?inputQty:(p.cq?inputQty*p.cq:0);
   const cartons=mode==='parcel'?0:(p.cq?inputQty:0);
   return {...p,index:i,inputQty,units,cartons};
 }).filter(Boolean);
}

function draw(){
 updateModeUI();
 const a=sel();
 let units=0,cartons=0,goodsKg=0,vol=0,lines=[];

 a.forEach(p=>{
   units+=p.units;

   if(mode==='parcel'){
     const kg=p.units*p.weight/1000;
     goodsKg+=kg;
     lines.push(
       '<div class="line"><strong>'+p.name+'</strong>: '+p.units+' game(s)<br>'+
       '<small>1 game: '+p.ul+' × '+p.uw+' × '+p.uh+' cm / '+inch(p.ul)+' × '+inch(p.uw)+' × '+inch(p.uh)+' in · '+
       (p.weight/1000).toFixed(3)+' kg / '+lb(p.weight/1000)+' lb / '+oz(p.weight/1000)+' oz<br>'+
       'Line weight: '+kg.toFixed(3)+' kg / '+lb(kg)+' lb'+
       (p.note?' · '+p.note:'')+
       '</small></div>'
     );
   }else if(p.cq){
     cartons+=p.cartons;
     goodsKg+=p.cartons*p.cw;
     vol+=p.cartons*p.cl*p.cwi*p.ch;
     lines.push(
       '<div class="line"><strong>'+p.name+'</strong>: '+p.cartons+' carton(s) = '+p.units+' games<br>'+
       '<small>'+p.cq+'/ctn · '+p.cl+' × '+p.cwi+' × '+p.ch+' cm / '+inch(p.cl)+' × '+inch(p.cwi)+' × '+inch(p.ch)+' in · '+
       p.cw+' kg / '+lb(p.cw)+' lb gross each</small></div>'
     );
   }
 });

 if(mode==='parcel'){
   metricLabel.textContent='Product weight';
   metric.textContent=goodsKg.toFixed(2)+' kg';
   imperialMetric.innerHTML='<strong>'+lb(goodsKg)+' lb</strong>';
   breakdown.innerHTML=
     'Games: <strong>'+units+'</strong><br>'+
     'Product weight: <strong>'+goodsKg.toFixed(2)+' kg / '+lb(goodsKg)+' lb</strong>';
   logistics.innerHTML=lines.join('')||'No games selected.';
   shipperText='';
 }

 else if(mode==='carton'){
   metricLabel.textContent='Total cartons';
   metric.textContent=cartons;
   imperialMetric.innerHTML='<strong>'+units+' games · '+goodsKg.toFixed(1)+' kg / '+lb(goodsKg)+' lb</strong>';
   breakdown.innerHTML=
     'Master cartons: <strong>'+cartons+'</strong><br>'+
     'Games inside: <strong>'+units+'</strong><br>'+
     'Carton gross total: <strong>'+goodsKg.toFixed(1)+' kg / '+lb(goodsKg)+' lb</strong><br>'+
     'Carton volume: <strong>'+(vol/1000000).toFixed(3)+' m³</strong>';
   logistics.innerHTML=lines.join('')||'No cartons selected.';
   shipperText='';
 }

 else{
   const L=120;
   const W=palletType.value==='euro'?80:100;
   const maxH=Math.max(30,Number(height.value)||180);
   const baseH=15;
   const usableH=Math.max(1,maxH-baseH);
   const spaceFactor=Math.max(1,Number(factor.value)||1.15);
   const neededVol=vol*spaceFactor;
   const capacity=L*W*usableH;
   const autoPallets=cartons?Math.max(1,Math.ceil(neededVol/capacity)):0;
   const override=Math.max(0,Math.floor(Number(palletOverride.value)||0));
   const pallets=cartons?(override||autoPallets):0;
   const loadH=pallets?neededVol/(L*W*pallets):0;
   const totalH=pallets?baseH+loadH:0;
   const palletKg=Math.max(0,Number(baseWeight.value)||20);
   const totalKg=goodsKg+pallets*palletKg;
   const avgKg=pallets?totalKg/pallets:0;
   const overHeight=pallets&&totalH>maxH;

   metricLabel.textContent=override?'Pallets selected':'Estimated pallets';
   metric.textContent=pallets;
   metric.classList.toggle('bad',!!overHeight);
   metric.classList.toggle('ok',!overHeight);
   imperialMetric.innerHTML='<strong>'+cartons+' cartons · '+units+' games</strong>';

   breakdown.innerHTML=
     'Master cartons: <strong>'+cartons+'</strong><br>'+
     'Games inside: <strong>'+units+'</strong><br>'+
     'Goods gross: <strong>'+goodsKg.toFixed(1)+' kg / '+lb(goodsKg)+' lb</strong><br>'+
     'Pallets: <strong>'+pallets+(override?' (manual)':' (auto)')+'</strong><br>'+
     'Estimated shipment gross: <strong>'+totalKg.toFixed(1)+' kg / '+lb(totalKg)+' lb</strong>';

   const pallet=
     '<h3>Pallet estimate</h3>'+
     (pallets
       ? pallets+' pallet(s), each approx. '+L+' × '+W+' × <strong class="'+(overHeight?'bad':'ok')+'">'+totalH.toFixed(1)+' cm</strong><br>'+
         inch(L)+' × '+inch(W)+' × '+inch(totalH)+' in<br>'+
         'Average gross per pallet: <strong>'+avgKg.toFixed(1)+' kg / '+lb(avgKg)+' lb</strong>'+
         (overHeight?'<div class="warning"><strong>Too tall for the selected maximum.</strong> Use more pallets or increase the max loaded height.</div>':'')
       : 'No cartons selected.');

   logistics.innerHTML=(lines.join('')||'No cartons selected.')+pallet;

   shipperText=cartons
     ? 'PACKING DETAILS\n'+
       'Pallets: '+pallets+(override?' (manual count)':' (estimated)')+'\n'+
       'Contents: '+units+' games\n'+
       'Master cartons: '+cartons+'\n'+
       'Approx. pallet L x W x H: '+L+' x '+W+' x '+totalH.toFixed(1)+' cm / '+inch(L)+' x '+inch(W)+' x '+inch(totalH)+' in\n'+
       'Approx. average gross per pallet: '+avgKg.toFixed(1)+' kg / '+lb(avgKg)+' lb\n'+
       'Estimated shipment gross: '+totalKg.toFixed(1)+' kg / '+lb(totalKg)+' lb\n\n'+
       a.map(p=>p.name+': '+p.cartons+' cartons / '+p.units+' games').join('\n')+
       '\n\nPlease confirm final pallet dimensions and gross weights after physical packing.'
     : '';
 }
}

async function copyForShipper(){
 if(!shipperText)return;
 try{
   await navigator.clipboard.writeText(shipperText);
 }catch(e){
   const t=document.createElement('textarea');
   t.value=shipperText;
   document.body.appendChild(t);
   t.select();
   document.execCommand('copy');
   t.remove();
 }
 copyStatus.textContent='✓ Copied';
 setTimeout(()=>copyStatus.textContent='',2000);
}

function resetQ(){
 qtyState[mode]=P.map(()=>0);
 make();
 draw();
}

make();
draw();
</script>
</body>
</html>
